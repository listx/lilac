image: nixos/26.05
sources:
  - https://git.sr.ht/~listx/lilac
oauth: pages.sr.ht/PAGES:RW
environment:
  site: lilac.funloop.org
packages:
- nixos.hut
tasks:
  - build: |
      cd lilac
      nix-shell --run "make build-release"
  - test: |
      cd lilac
      nix-shell --run "make test" #
  - print_lilac_version: |
      lilac/result/bin/lilac --version
  - weave: |
      cd lilac
      rm -f image/*.svg
      nix-shell --run "make weave"
  - compile-prod-cljs: |
      cd lilac
      nix-shell --run "make prod-cljs"
  - verify-git-health: |
      cd lilac
      git diff
      if [[ -z "$(git status --porcelain)" ]]; then
        echo "Clean (no untracked files either)."
      else
        echo "Modified or untracked files present."
        exit 1
      fi
  - lint: |
      cd lilac
      nix-shell --run "make lint"
  - publish: |
      if [[ "$GIT_REF" != "refs/heads/main" ]]; then
        echo "Skipping publishing step because current branch is '$GIT_REF' (not refs/heads/main)."
        exit 0
      fi
      cd lilac
      nix-shell --run "make site.tar.gz"
      hut pages publish -d $site site.tar.gz
