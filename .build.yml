image: nixos/latest
secrets:
  - 5de45cde-db04-468b-94dd-7ef3a53eeace
sources:
  - git@git.sr.ht:~listx/lilac
tasks:
  - lint: |
      cd lilac
      nix-shell --run "make lint"
  - weave: |
      cd lilac
      rm -f image/*.svg
      nix-shell --run "make weave"
  - build: |
      cd lilac
      nix-shell --run "make build-release"
  - test: |
      cd lilac
      nix-shell --run "make test" #
  - print_lilac_version: |
      lilac/result/bin/lilac --version
