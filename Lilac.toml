name = "Lilac"
homepage = "https://lilac.funloop.org"
repo = "https://git.sr.ht/~listx/lilac"
version = "0.1.0.7"

nonTangledPathspecs = [ #
    ":(exclude,top).gitmodules", #
    ":(exclude,top)LICENSE",
    ":(exclude,top,glob)image/*.svg",
    ":(exclude,top,glob)*.org",
    ":(exclude,top)image/PNG-Gradient.png", #
    ":(exclude,top)site/js/lilac.js.injectme", #
    ":(exclude,top)bib.json", #
    ":(exclude,top)csl-styles", #
    ":(exclude,top)nix/sources.json", #
    ":(exclude,top)nix/sources.nix",
    ":(exclude,top)resources/public" #
]

bibliography = ["bib.json"]
citationStyle = "csl-styles/ieee.csl"

[htmlHead]
onlyLocalImports = true
injection = """
<link rel="stylesheet" href="/vendor/source-fonts/source-fonts.css">
<script>
  window.MathJax = {
      loader: { paths: { "mathjax-newcm": "/vendor/mathjax-newcm-font" } },
      output: { font: "mathjax-newcm" },
  tex: {
      tags: 'ams'
  },
  options: {
      ignoreHtmlClass: 'verbatim|code'
  }
};
</script>
<script id="MathJax-script" async="" src="/vendor/mathjax/tex-mml-chtml.js"></script>
"""
