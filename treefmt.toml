# One CLI to format the code tree - https://github.com/numtide/treefmt
[global]
excludes = [
  "*.cabal",
  "*.gitkeep",
  "*.json",
  "*.org",
  "*.toml",
  "*.yml",
  ".envrc",
  ".gitignore",
  "cabal.project",
  "doc/*",
  "image/*",
  "LICENSE",
  "Makefile",
  "nix/packages/*.nix",
  "nix/sources.nix",
  "test/Lilac/ParseSpec/*",
]

[formatter.haskell]
command = "ormolu"
options = [
  "--mode", "inplace",
  "--check-idempotence"
]
includes = ["*.hs"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = [
    "--binary-next-line",
    "--indent", "0",
    "--func-next-line",
    "--write",
]
includes = ["*.sh"]
